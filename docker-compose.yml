version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ennui_postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      # Monte le fichier local init.sql vers le dossier d'initialisation du conteneur
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Optionnel : persistance des données
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
